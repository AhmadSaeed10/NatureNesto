name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run contrast
      - run: npm run format:check
      - run: npm run build

  # RLS and policy tests against a throwaway local database, never the hosted project.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the seed matches src/content
        run: npm run seed:generate && git diff --exit-code supabase/seed.sql
      - name: Start Postgres with migrations and seed
        run: npx supabase db start
      - name: Run pgTAP tests
        run: npx supabase test db
